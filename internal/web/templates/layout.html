<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · qcfg</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
</head>
<body hx-boost="true"{{if .CSRF}} hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'{{end}}>
<header>
  <a class="brand" href="/">qcfg</a>
  {{if .LoggedIn}}
  <nav>
    <a href="/">Projects</a>
    <a href="/devices">Devices</a>
    <a href="/tokens">Tokens</a>
    {{if .Admin}}<a href="/users">Users</a>{{end}}
    <span>{{.User.Name}}</span>
    <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Logout</button></form>
  </nav>
  {{end}}
</header>
<main>
  {{if .Msg}}<p class="msg">{{.Msg}}</p>{{end}}
  {{if .Err}}<p class="err">{{.Err}}</p>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
